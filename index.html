<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AR Hardware Movement + 3D Models</title>
<style>
  body { margin: 0; overflow: hidden; background-color: #000; font-family: Tahoma, sans-serif; color: #fff; }
  
  /* رابط کاربری اولیه */
  #ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85); z-index: 100; padding: 20px; box-sizing: border-box;
  }
  .btn-start {
    padding: 18px 50px; font-size: 20px; font-weight: bold; color: #fff;
    background: #ff3d00; border: none; border-radius: 30px; cursor: pointer;
    box-shadow: 0 4px 15px rgba(255,61,0,0.4); margin-bottom: 20px;
  }
  .model-uploader {
    display: flex; flex-direction: column; align-items: center;
    background: #1f2937; padding: 20px; border-radius: 15px; width: 100%; max-width: 350px;
  }
  .model-uploader label {
    background: #3b82f6; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold;
  }
  .model-uploader input[type="file"] { display: none; }
  #model-name { margin-top: 10px; font-size: 14px; color: #9ca3af; direction: ltr; }
  
  /* راهنما در حین اجرا */
  #hint {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); padding: 12px 24px; border-radius: 30px;
    color: #60a5fa; font-size: 15px; pointer-events: none; z-index: 50;
    text-align: center; width: max-content; max-width: 90%; display: none;
  }

  /* نمایش خطا */
  #error-box {
    position: absolute; top: 0; left: 0; width: 100%; background: #dc2626;
    color: white; padding: 15px; z-index: 1000; text-align: center; display: none;
  }
</style>
</head>
<body>

  <div id="error-box"></div>
  
  <div id="ui-layer">
    <h1 style="color: #60a5fa; text-align: center;">واقعیت افزوده سخت‌افزاری</h1>
    
    <!-- بخش بارگذاری مدل -->
    <div class="model-uploader">
      <p style="margin-top: 0; text-align: center; font-size: 14px;">مدل سه‌بعدی خود را انتخاب کنید (فرمت GLB):</p>
      <label for="model-file">انتخاب فایل مدل (.glb)</label>
      <input type="file" id="model-file" accept=".glb">
      <div id="model-name">هنوز مدلی انتخاب نشده است</div>
    </div>

    <button id="start-ar-btn" class="btn-start" disabled style="opacity:0.5;">ابتدا مدل را انتخاب کنید</button>
    <p id="support-msg" style="font-size: 13px; color: #9ca3af; text-align: center; margin-top: 15px;"></p>
  </div>

  <div id="hint">برای قرار دادن مدل روی زمین، گوشی را به سمت زمین بگیرید و صفحه را لمس کنید</div>

  <!-- ایمپورت Three.js از CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ==========================================
    // مدیریت خطا
    // ==========================================
    window.addEventListener('error', function(e) {
      const box = document.getElementById('error-box');
      box.style.display = 'block';
      box.innerText = 'خطا: ' + e.message;
    });

    // ==========================================
    // بررسی پشتیبانی WebXR
    // ==========================================
    const supportMsg = document.getElementById('support-msg');
    const startBtn = document.getElementById('start-ar-btn');
    const uiLayer = document.getElementById('ui-layer');
    const hint = document.getElementById('hint');
    
    let isWebXRSupported = false;

    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
        isWebXRSupported = supported;
        if (!supported) {
          supportMsg.innerHTML = '⚠️ مرورگر یا گوشی شما از AR سخت‌افزاری (WebXR) پشتیبانی نمی‌کند. برای حرکت واقعی در فضا، از گوشی اندروید با مرورگر Chrome استفاده کنید.';
          supportMsg.style.color = '#ef4444';
        } else {
          supportMsg.innerHTML = '✅ سخت‌افزار شما از AR پشتیبانی می‌کند.';
          supportMsg.style.color = '#10b981';
        }
      });
    } else {
      supportMsg.innerHTML = '⚠️ مرورگر شما از WebXR پشتیبانی نمی‌کند (مثلاً در iOS).';
      supportMsg.style.color = '#ef4444';
    }

    // ==========================================
    // مدیریت آپلود مدل
    // ==========================================
    let loadedModel = null;
    const modelFileInput = document.getElementById('model-file');
    const modelNameDiv = document.getElementById('model-name');

    modelFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      modelNameDiv.innerText = file.name;
      modelNameDiv.style.color = '#f59e0b';
      
      const loader = new GLTFLoader();
      const url = URL.createObjectURL(file);

      loader.load(url, (gltf) => {
        loadedModel = gltf.scene;
        
        // تنظیم مقیاس مدل (چون مدل‌ها سایزهای مختلفی دارند)
        // این بخش را می‌توانید دستی تغییر دهید
        loadedModel.scale.set(0.5, 0.5, 0.5); 
        
        modelNameDiv.innerText = 'آماده است: ' + file.name;
        modelNameDiv.style.color = '#10b981';
        startBtn.disabled = false;
        startBtn.style.opacity = '1';
        startBtn.innerText = 'شروع AR';
      }, undefined, (err) => {
        console.error(err);
        modelNameDiv.innerText = 'خطا در خواندن فایل';
        modelNameDiv.style.color = '#ef4444';
      });
    });

    // ==========================================
    // راه‌اندازی Three.js
    // ==========================================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    
    // اضافه کردن Canvas به DOM (مخفی تا زمانی که AR شروع شود)
    renderer.domElement.style.position = 'absolute';
    renderer.domElement.style.top = '0';
    renderer.domElement.style.left = '0';
    renderer.domElement.style.zIndex = '1';
    document.body.appendChild(renderer.domElement);

    // نورپردازی
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
    hemiLight.position.set(0.5, 1, 0.25);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(1, 2, 1);
    scene.add(dirLight);

    // ==========================================
    // Hit Test (تشخیص سطح زمین)
    // ==========================================
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.1, 0.12, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.8 })
    );
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    let placedModel = null;

    // ==========================================
    // دکمه شروع AR
    // ==========================================
    startBtn.addEventListener('click', async () => {
      if (!isWebXRSupported) {
        alert('سخت‌افزار شما از AR پشتیبانی نمی‌کند.');
        return;
      }

      try {
        uiLayer.style.display = 'none';
        hint.style.display = 'block';
        setTimeout(() => { hint.style.opacity = '0'; }, 6000);

        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test', 'local-floor']
        });
        
        renderer.xr.setSession(session);
        session.addEventListener('end', () => {
          uiLayer.style.display = 'flex';
          hint.style.display = 'none';
          if (placedModel) { scene.remove(placedModel); placedModel = null; }
        });
      } catch (err) {
        console.error(err);
        alert('خطا در راه‌اندازی AR: ' + err.message);
        uiLayer.style.display = 'flex';
      }
    });

    // ==========================================
    // حلقه رندر (WebXR)
    // ==========================================
    renderer.setAnimationLoop((timestamp, frame) => {
      if (frame) {
        // مدیریت Hit Test
        if (!hitTestSourceRequested) {
          frame.session.requestReferenceSpace('viewer').then((referenceSpace) => {
            frame.session.requestHitTestSource({ space: referenceSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          frame.session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const referenceSpace = renderer.xr.getReferenceSpace();
          const hitTestResults = frame.getHitTestResults(hitTestSource);

          if (hitTestResults.length) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);

            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }

      // رندر صحنه
      renderer.render(scene, camera);
    });

    // ==========================================
    // لمس صفحه برای قرار دادن مدل
    // ==========================================
    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (reticle.visible && loadedModel) {
        // اگر مدلی قبلاً قرار داده شده، حذفش کن
        if (placedModel) {
          scene.remove(placedModel);
        }
        
        // کلون کردن مدل و قرار دادن در مکان جدید
        placedModel = loadedModel.clone();
        
        // استخراج موقعیت از reticle
        placedModel.position.setFromMatrixPosition(reticle.matrix);
        placedModel.quaternion.setFromRotationMatrix(reticle.matrix);
        
        scene.add(placedModel);
      }
    });

    // ==========================================
    // مدیریت ریسایز
    // ==========================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
